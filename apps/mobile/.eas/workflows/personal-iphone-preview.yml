name: Personal iPhone preview

jobs:
  build_preview:
    name: Build iPhone preview
    type: build
    params:
      platform: ios
      profile: preview

  publish_preview_update:
    name: Publish iPhone preview update
    needs: [build_preview]
    type: update
    environment: preview
    env:
      APP_VARIANT: preview
      MOBILE_VERSION_POLICY: fingerprint
      T3CODE_EXPO_PUSH_ALERTS: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    params:
      branch: preview
      platform: ios
