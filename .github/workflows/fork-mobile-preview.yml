name: Personal iPhone Preview

on:
  workflow_dispatch:
  # fork-sync.yml calls this after it pushes a merged main. A push made with
  # GITHUB_TOKEN never fires `push` triggers, so without this entry the iPhone
  # OTA silently stopped tracking main whenever the scheduled sync — rather
  # than a human — was what moved it.
  workflow_call:
    inputs:
      ref:
        description: Exact main commit to publish
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        required: true
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/client-runtime/**
      - packages/contracts/**
      - packages/shared/**
      - assets/**
      - scripts/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/fork-mobile-preview.yml

# Keep updates in commit order. If several pushes arrive while an iOS build is
# running, GitHub retains the newest queued run after the build finishes.
concurrency:
  group: personal-iphone-preview
  cancel-in-progress: false

jobs:
  deploy:
    name: Build if needed, then publish
    if: github.repository == 'Simcity400/t3code-personal'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_VARIANT: preview
      MOBILE_VERSION_POLICY: fingerprint
      T3CODE_EXPO_PUSH_ALERTS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check Expo credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "The EXPO_TOKEN repository secret is missing." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Pull preview environment variables
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull preview --non-interactive

      - name: Ensure a compatible iPhone build exists
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # The preview variant pins runtimeVersion to the shared constant
          # (apps/mobile/app.config.ts -> scripts/lib/personal-mobile-runtime.ts),
          # so updates are compatible by runtime version, not by fingerprint.
          # Probing fingerprints here would report "no compatible build" on every
          # source change and trigger a needless full native build.
          runtime="$(node --no-warnings --input-type=module --eval 'import { PERSONAL_MOBILE_RUNTIME_VERSION } from "../../scripts/lib/personal-mobile-runtime.ts"; process.stdout.write(PERSONAL_MOBILE_RUNTIME_VERSION);')"
          if [ -z "$runtime" ]; then
            echo "Could not read PERSONAL_MOBILE_RUNTIME_VERSION." >&2
            exit 1
          fi
          matching="$(eas build:list --platform ios --build-profile preview --status finished --runtime-version "$runtime" --limit 1 --json --non-interactive | sed -n '/^[[{]/,$p' | jq 'length')"

          echo "Pinned iOS runtime version: $runtime"
          if [ "$matching" -eq 0 ]; then
            echo "No compatible iPhone build exists. Building one now."
            eas build --platform ios --profile preview --non-interactive
            echo ":building_construction: Built a new iPhone app for runtime version \`$runtime\`. Install this build once before expecting over-the-air updates." >> "$GITHUB_STEP_SUMMARY"
          else
            echo ":white_check_mark: A compatible iPhone build already exists for runtime version \`$runtime\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish iPhone update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          message="$(git log -1 --pretty=%s | head -c 120) ($(git rev-parse --short=9 HEAD))"
          eas update \
            --channel preview \
            --environment preview \
            --platform ios \
            --message "$message" \
            --non-interactive
          echo ":white_check_mark: Published the iPhone update to the preview channel." >> "$GITHUB_STEP_SUMMARY"
