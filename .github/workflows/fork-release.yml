name: Fork Release

# Fork-only pipeline: builds an unsigned Windows installer and publishes it as
# a GitHub prerelease on this
# repository. Packaged apps point their electron-updater feed here
# (GITHUB_REPOSITORY at build time), so the in-app update button picks these
# releases up. Kept separate from upstream's release.yml to avoid merge
# conflicts; that workflow needs T3's own secrets and runners and cannot run
# on this fork.

# Every direct push to main publishes the personal Windows build so the one
# installed app follows the same branch as mobile OTA and source checkouts.
# workflow_dispatch remains available for a manual rebuild.
on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Exact main commit to package
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: true

env:
  FORK_BRANCH: main

jobs:
  # Manual runs first pull in upstream's latest changes. Scheduled fork-sync
  # runs call this workflow with the exact main commit they already pushed.
  sync_upstream:
    name: Merge upstream/main
    if: inputs.ref == '' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.sync.outputs.ref }}
      has_changes: ${{ steps.sync.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          fetch-tags: true

      - id: sync
        name: Merge upstream and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main

          if ! git merge --no-edit upstream/main; then
            echo "::error::Merge conflict with upstream. On your computer, open Claude Code in the T3 Code folder and say: finish the upstream merge, then push. The next build will pick it up."
            exit 1
          fi

          # Pushes made with GITHUB_TOKEN never trigger workflows, so this
          # cannot recurse; the build continues in this same run instead.
          git push origin "HEAD:$FORK_BRANCH"

          head_sha="$(git rev-parse HEAD)"
          echo "ref=$head_sha" >> "$GITHUB_OUTPUT"

          last_tag="$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -n 1)"
          if [[ -n "$last_tag" && "$(git rev-parse "$last_tag^{commit}")" == "$head_sha" ]]; then
            echo "Nothing new since the last release ($last_tag). Skipping build."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
  # Same rationale as upstream release.yml: node-pty has no Linux prebuilt,
  # and the Windows package bundles a Linux pty.node for the WSL backend.
  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    needs: [sync_upstream]
    if: |
      always() && !cancelled() &&
      (inputs.ref != '' || github.event_name == 'push' ||
       (needs.sync_upstream.result == 'success' && needs.sync_upstream.outputs.has_changes == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.event_name == 'push' && github.sha || needs.sync_upstream.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...

      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty linux-x64 prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  release:
    name: Build and release Windows x64
    needs: [sync_upstream, build_wsl_node_pty]
    if: ${{ always() && !cancelled() && needs.build_wsl_node_pty.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # T3 Connect public build config (same values as .env). These are the
      # public client-side values shipped inside the official T3 Code build —
      # not credentials. Without them, builds disable T3 Connect entirely
      # (no sign-in, no relay device connections).
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
      T3CODE_RELAY_URL: https://relay.t3.codes
      # Bake the private-repo update feed into app-update.yml. At runtime only
      # the updater reads the existing GitHub CLI login; agents never inherit
      # the credential through the app process environment.
      T3CODE_DESKTOP_UPDATE_PRIVATE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.event_name == 'push' && github.sha || needs.sync_upstream.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - id: release_meta
        name: Resolve fork nightly version
        shell: bash
        run: |
          nightly_date="$(date -u +%Y%m%d)"
          node scripts/resolve-nightly-release.ts \
            --date "$nightly_date" \
            --run-number "${{ github.run_id }}" \
            --sha "$(git rev-parse HEAD)" \
            --github-output

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ steps.release_meta.outputs.version }}"

      - name: Download WSL node-pty prebuild
        uses: actions/download-artifact@v8
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Build desktop artifact
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ steps.release_meta.outputs.version }}" \
            --wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for asset in $pattern; do
              cp "$asset" release-publish/
            done
          done

          # electron-updater's private GitHub provider always requests
          # latest.yml, even when the app's selected channel is nightly.
          # Publish the same signed metadata under both names so installed
          # personal builds can discover the newest prerelease.
          if [[ ! -f release-publish/nightly.yml ]]; then
            echo "Missing release-publish/nightly.yml" >&2
            exit 1
          fi
          cp release-publish/nightly.yml release-publish/latest.yml

          ls -la release-publish

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ inputs.ref != '' && inputs.ref || github.event_name == 'push' && github.sha || needs.sync_upstream.outputs.ref }}
          name: ${{ steps.release_meta.outputs.name }}
          prerelease: true
          make_latest: false
          files: release-publish/*
          fail_on_unmatched_files: true
