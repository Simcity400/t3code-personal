name: Fork Release

# Fork-only pipeline: builds an unsigned Windows installer on every push and
# publishes it as a GitHub prerelease on this repository. Packaged apps point
# their electron-updater feed here (GITHUB_REPOSITORY at build time), so the
# in-app update button picks these releases up. Kept separate from upstream's
# release.yml to avoid merge conflicts; that workflow needs T3's own secrets
# and runners and cannot run on this fork.

on:
  push:
    branches:
      - main
      - subagent-preview
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same rationale as upstream release.yml: node-pty has no Linux prebuilt,
  # and the Windows package bundles a Linux pty.node for the WSL backend.
  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...

      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty linux-x64 prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  release:
    name: Build and release Windows x64
    needs: [build_wsl_node_pty]
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # T3 Connect public build config (same values as .env, see .env.example).
      # Configure these as repository secrets; without them the build still
      # succeeds but T3 Connect (sign-in, relay device connections) is disabled.
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ secrets.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ secrets.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ secrets.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ secrets.T3CODE_RELAY_URL }}
      # Bake the private-repo update feed into app-update.yml. At runtime the
      # installed app needs a GH_TOKEN env var (fine-grained PAT with read-only
      # contents access to this repository) to check for and download updates.
      T3CODE_DESKTOP_UPDATE_PRIVATE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - id: release_meta
        name: Resolve fork nightly version
        shell: bash
        run: |
          nightly_date="$(date -u +%Y%m%d)"
          node scripts/resolve-nightly-release.ts \
            --date "$nightly_date" \
            --run-number "${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            --github-output

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ steps.release_meta.outputs.version }}"

      - name: Download WSL node-pty prebuild
        uses: actions/download-artifact@v8
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Build desktop artifact
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ steps.release_meta.outputs.version }}" \
            --wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for asset in $pattern; do
              cp "$asset" release-publish/
            done
          done
          ls -la release-publish

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.name }}
          prerelease: true
          make_latest: false
          files: release-publish/*
          fail_on_unmatched_files: true
