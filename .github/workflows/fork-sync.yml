name: Fork Sync

# Integrate published official nightlies centrally, then build the personal app.
# Source versions stay upstream-owned; fork-upstream.json records progress.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  gate:
    name: Check published nightlies and missing builds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sync: ${{ steps.check.outputs.sync }}
      release: ${{ steps.check.outputs.release }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fork-sync.ts check

  sync:
    name: Integrate the published official nightly
    needs: gate
    if: needs.gate.outputs.sync == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ref: ${{ steps.merge.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: merge
        env:
          NIGHTLY_TAG: ${{ needs.gate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/fork-sync.ts merge
          git push origin HEAD:main
      - name: Clear the retired source-updater marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/needs-merge-help" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/needs-merge-help"
          fi
      - name: Explain a stopped sync
        if: failure()
        run: |
          echo 'The official nightly could not be integrated. Review this run before publishing; the installed app keeps its last successful build.' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish the personal Windows update
    needs: [gate, sync]
    # Also retries a failed publish when the nightly was already integrated.
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.release == 'true' && (needs.sync.result == 'success' || needs.sync.result == 'skipped') }}
    uses: ./.github/workflows/fork-release.yml
    with:
      ref: ${{ needs.sync.outputs.ref || needs.gate.outputs.ref }}
    permissions:
      contents: write

  mobile:
    name: Publish the synced iPhone update
    needs: sync
    # GITHUB_TOKEN pushes do not start push workflows, so call this explicitly.
    uses: ./.github/workflows/fork-mobile-preview.yml
    with:
      ref: ${{ needs.sync.outputs.ref }}
    secrets: inherit
    permissions:
      contents: read
