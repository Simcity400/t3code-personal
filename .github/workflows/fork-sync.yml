name: Fork Sync

# Fork-only pipeline that makes GitHub the single source of truth. Every two
# hours it checks whether the official app published a new nightly; when it
# has, this job merges upstream/main into main and pins the package versions,
# so every machine only ever pulls a ready-made main — no machine merges or
# pins locally, and machines can never invent conflicting history.
#
# Conflicts confined to the four version-pinned package.json files are
# resolved automatically (upstream's side wins; the pin step re-stamps them —
# they conflict on every sync by construction). When any other file conflicts
# — and equally when the push itself is refused, for a workflow change, a
# non-fast-forward race, branch protection or a transport failure — the job
# pushes a marker branch `needs-merge-help`; the in-app fork updater then shows
# a pill telling Alex to open Claude Code (on any machine) and say "finish the
# upstream merge". The marker records only that the sync stopped and needs a
# human, never why: nothing downstream can tell those causes apart, so the run
# log is the place to look. After a resolved main is pushed, the next sync run
# deletes the marker automatically.
#
# Workflow allowlist. This fork keeps exactly three workflows of its own —
# fork-sync.yml, fork-release.yml and fork-mobile-preview.yml. Every other
# `.github/workflows/*` file upstream ships is deleted here: they need T3's
# Blacksmith runners, secrets or PR bots, so on this fork they only ever queue
# runs that can never succeed. Keeping them deleted is not cosmetic — a push
# made with GITHUB_TOKEN is REJECTED outright when it adds or modifies any
# `.github/workflows/*` file, because that token has no `workflows` permission.
# Before this allowlist existed, the sync therefore broke silently every time
# upstream touched a workflow. So the merge step below (a) treats a conflict in
# a non-allowlisted workflow as "delete it", (b) deletes any non-allowlisted
# workflow a clean merge brought in — both BEFORE the merge is committed, so the
# commit this job creates never carries a workflow change at all — and (c)
# refuses to continue, before anything is pushed, if the pushed range's diff
# still shows ANY workflow path, the fork's own three included.
#
# UNTESTED, and it cannot be tested without attempting a push: whether GitHub
# judges a push by its net old..new diff or by each commit in it. (c) is the
# net-diff check, which is necessary either way; (b) folding into the merge
# commit costs nothing and helps under the stricter reading. If the stricter
# reading holds, an upstream commit that edits a workflow anywhere in the range
# would still be refused at `git push`, which fails this job loudly — the
# marker/human path then applies as usual. No bot merge in this fork's history
# has ever had a workflow-touching commit in its range, so neither reading has
# been exercised here.
#
# Costs almost nothing: the gate job is seconds without a checkout, and the
# full sync only runs when a new nightly is actually out (~once a day).

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  gate:
    name: Check for a new official nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      nightly: ${{ steps.check.outputs.nightly }}
    steps:
      - id: check
        name: Compare npm nightly to the pinned version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nightly="$(curl -fsSL https://registry.npmjs.org/-/package/t3/dist-tags | jq -r '.nightly // empty')"
          pinned="$(gh api "repos/$GITHUB_REPOSITORY/contents/apps/desktop/package.json?ref=main" --jq .content | base64 -d | jq -r '.version // empty')"
          marker="$(gh api "repos/$GITHUB_REPOSITORY/branches/needs-merge-help" --jq .name 2>/dev/null || true)"

          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"
          echo "npm nightly: ${nightly:-unknown} | pinned: ${pinned:-unknown} | conflict marker: ${marker:-none}"

          if [[ -n "$nightly" && -n "$pinned" && "$nightly" != "$pinned" ]] || [[ -n "$marker" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to do."
          fi

  sync:
    name: Merge upstream and pin
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream/main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main

          # The fork's own workflows. Everything else under .github/workflows is
          # upstream-only and must not exist on this fork (see the header).
          # `case` rather than `grep -qxF -- "$path"`: a path is data, and grep
          # would read one containing a newline as several alternative patterns.
          is_fork_workflow() {
            case "$1" in
              .github/workflows/fork-sync.yml) return 0 ;;
              .github/workflows/fork-release.yml) return 0 ;;
              .github/workflows/fork-mobile-preview.yml) return 0 ;;
              *) return 1 ;;
            esac
          }
          # The four manifests whose version line the fork pins.
          is_pin_file() {
            case "$1" in
              apps/desktop/package.json) return 0 ;;
              apps/server/package.json) return 0 ;;
              apps/web/package.json) return 0 ;;
              packages/contracts/package.json) return 0 ;;
              *) return 1 ;;
            esac
          }

          # --no-commit so the workflow cleanup below lands INSIDE the merge
          # commit: the commit this job creates then never adds a file
          # GITHUB_TOKEN may not push, rather than adding one and deleting it in
          # a follow-up. --no-ff keeps that commit existing even in the
          # degenerate no-fork-commits case.
          if ! git merge --no-commit --no-ff --no-edit upstream/main; then
            # Two conflict classes resolve themselves:
            #   * the four version-pinned manifests, which conflict on every sync
            #     by construction (upstream bumps the line the fork pins) and are
            #     rewritten by the pin step below anyway — take upstream's side;
            #   * a non-allowlisted .github/workflows file, which this fork does
            #     not keep at all — delete it, whatever the conflict shape
            #     (modify/delete and add/add both land here).
            # Anything else — including a conflict in one of the fork's OWN
            # workflows — is a genuine conflict and takes the marker path. Any
            # hiccup in the auto-resolution (e.g. a modify/delete conflict where
            # no "theirs" blob exists) also falls through to the marker instead
            # of killing the job silently.
            resolved=false
            conflicts_file="$(mktemp)"
            theirs_file="$(mktemp)"
            drop_file="$(mktemp)"
            # -z everywhere a path is carried. Without it git C-quotes any path
            # that is not plain ASCII, or that holds a tab, newline, quote or
            # backslash, and that quoted display string is not a path `git rm`
            # or `git checkout` can find — which would abort the job under
            # set -e without ever raising the marker.
            git diff -z --name-only --diff-filter=U > "$conflicts_file"
            auto=true
            while IFS= read -r -d '' f; do
              [ -n "$f" ] || continue
              if is_pin_file "$f"; then
                printf '%s\0' "$f" >> "$theirs_file"
              elif { case "$f" in .github/workflows/*) true ;; *) false ;; esac; } &&
                ! is_fork_workflow "$f"; then
                printf '%s\0' "$f" >> "$drop_file"
              else
                auto=false
                break
              fi
            done < "$conflicts_file"

            if [ -s "$conflicts_file" ] && [ "$auto" = true ]; then
              echo "Only auto-resolvable conflicts; taking upstream's side on the pins and dropping upstream-only workflows."
              step_failed=false
              while IFS= read -r -d '' f; do
                git checkout --theirs -- "$f" && git add -- "$f" || { step_failed=true; break; }
              done < "$theirs_file"
              if [ "$step_failed" = false ]; then
                while IFS= read -r -d '' f; do
                  git rm -q --cached -f -- "$f" || { step_failed=true; break; }
                  rm -f -- "$f"
                done < "$drop_file"
              fi
              if [ "$step_failed" = false ]; then
                resolved=true
              fi
            fi
            if [ "$resolved" != true ]; then
              git merge --abort || true
              # Leave a marker branch the in-app updater can see; the pill then
              # asks Alex to have Claude Code resolve the merge from any machine.
              # Push our own HEAD, not upstream/main: the updater only checks that
              # the branch exists, and pushing upstream's ref is rejected whenever
              # it touches .github/workflows (GITHUB_TOKEN lacks the `workflows`
              # permission) — which silently suppressed the pill.
              git push origin HEAD:refs/heads/needs-merge-help --force
              echo "::error::Official changes conflict with fork customizations. Open Claude Code in the T3 Code folder on any computer and say: finish the upstream merge. Once the resolved merge is pushed to main, this workflow cleans up on its next run."
              exit 1
            fi
          fi

          # A brand-new upstream workflow does not conflict — it just appears in
          # the merged tree. Drop every non-allowlisted workflow before the merge
          # is committed, so the commit that gets pushed never adds one. -z and
          # a read loop rather than xargs: xargs would split a path on its
          # spaces, and a newline-delimited read would hand us git's C-quoted
          # display form for any unusual name.
          tracked_workflows="$(mktemp)"
          git ls-files -z .github/workflows > "$tracked_workflows"
          while IFS= read -r -d '' f; do
            [ -n "$f" ] || continue
            if is_fork_workflow "$f"; then
              continue
            fi
            git rm -q --cached -f -- "$f"
            rm -f -- "$f"
            echo "Dropped upstream-only workflow: $f"
          done < "$tracked_workflows"

          # Only when a merge is actually pending. `git merge` on an upstream
          # that is already an ancestor says "Already up to date", exits 0 and
          # leaves no MERGE_HEAD — which is exactly the state of the run that
          # follows a by-hand marker resolution, and of a nightly-only re-pin.
          # An unconditional commit would fail there with "nothing to commit"
          # and, under set -e, take the marker cleanup and the re-pin down with
          # it.
          if [ -f "$(git rev-parse --git-path MERGE_HEAD)" ]; then
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            # No merge to make, but the cleanup above still staged something.
            git commit -q -m "chore(fork): drop upstream-only workflows"
          fi

          # Last line of defence, before anything is pushed. GITHUB_TOKEN has no
          # `workflows` permission, so a push that changes any
          # .github/workflows file is rejected — the fork's own three included.
          # A correct run leaves this diff empty: upstream-only workflows are
          # already absent on both sides, and anything else (say upstream
          # cleanly editing a file that shares a name with one of ours) is
          # exactly what must stop here rather than fail at the push.
          changed_workflows="$(git diff --name-only origin/main..HEAD -- .github/workflows)"
          if [ -n "$changed_workflows" ]; then
            printf '%s\n' "$changed_workflows"
            echo "::error::sync would push workflow changes (GITHUB_TOKEN cannot); resolve this by hand"
            exit 1
          fi

      - name: Pin package versions to the official nightly
        env:
          NIGHTLY: ${{ needs.gate.outputs.nightly }}
        run: |
          set -euo pipefail
          if [[ -z "$NIGHTLY" ]]; then
            echo "No nightly version resolved; skipping pin."
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const version = process.env.NIGHTLY;
            for (const file of [
              "apps/desktop/package.json",
              "apps/server/package.json",
              "apps/web/package.json",
              "packages/contracts/package.json",
            ]) {
              const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
              if (manifest.version === version) continue;
              manifest.version = version;
              fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
            }
          '
          if ! git diff --quiet; then
            git commit -am "chore(fork): pin nightly $NIGHTLY"
          fi

      - id: push
        name: Push main and clear the conflict marker
        run: |
          set -euo pipefail
          # A refused push must raise the in-app pill, not just redden a run
          # nobody is watching — that silence is the failure mode this whole
          # pipeline exists to remove. The guards above catch the workflow case
          # they can see; this covers whatever they cannot, including a
          # server-side rejection of a workflow-touching commit somewhere in the
          # range if GitHub judges pushes that way.
          if ! git push origin main; then
            # The marker has to survive the very rejection it reports. Push our
            # HEAD first, so the branch points at the work that needs help; but
            # under the strict per-commit reading that push carries the same
            # workflow-touching commits and is refused identically, so fall back
            # to the commit origin/main already holds, whose workflow files
            # GitHub has accepted by definition. The updater only tests that the
            # branch exists, so the fallback still raises the pill.
            marker=false
            if git push origin HEAD:refs/heads/needs-merge-help --force; then
              marker=true
            elif git push origin "$(git rev-parse origin/main)":refs/heads/needs-merge-help --force; then
              marker=true
            fi
            if [ "$marker" != true ]; then
              echo "::error::Could not raise the needs-merge-help marker either, so no in-app pill will appear; this red run is the only notice."
            fi
            # Deliberately not worded as a conflict: a refused push is also how
            # a non-fast-forward race, branch protection or a transport failure
            # arrives here, and the marker cannot tell them apart.
            echo "::error::The sync could not push main. Open Claude Code in the T3 Code folder on any computer and say: finish the upstream merge."
            exit 1
          fi
          git push origin :refs/heads/needs-merge-help 2>/dev/null || true
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    name: Publish the synced personal Windows app
    needs: sync
    uses: ./.github/workflows/fork-release.yml
    with:
      ref: ${{ needs.sync.outputs.ref }}
    permissions:
      contents: write

  # Same reason the desktop release is called rather than left to a push
  # trigger: this job's push used GITHUB_TOKEN, and GitHub does not fire `push`
  # workflows for those, so the iPhone OTA would otherwise never see a merge
  # the robot made.
  mobile:
    name: Publish the synced iPhone update
    needs: sync
    uses: ./.github/workflows/fork-mobile-preview.yml
    with:
      ref: ${{ needs.sync.outputs.ref }}
    secrets: inherit
    permissions:
      contents: read
